name: CI

# Manual trigger for now. Re-enable the push / pull_request triggers below
# once GitHub Actions is available for this account again.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Compile all sources
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q
